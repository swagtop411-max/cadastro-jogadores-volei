<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogadores de Vôlei</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header class="header">🏐 Cadastro de Jogadores de Vôlei</header>

  <main class="container">
    <section class="dashboard">
      <div class="card-dashboard">
        <span class="dashboard-label">Total de jogadores</span>
        <strong id="total">0 jogadores</strong>
      </div>
      <div class="card-dashboard">
        <span class="dashboard-label">Média geral</span>
        <strong id="media">0.0</strong>
      </div>
      <div class="card-dashboard">
        <span class="dashboard-label">Melhor jogador</span>
        <strong id="melhor">Nenhum</strong>
      </div>
    </section>

    <section class="filtros">
      <input type="search" id="busca" placeholder="🔍 Buscar jogador..." autocomplete="off">
      <select id="filtroNivel">
        <option value="">Todos os níveis</option>
        <option value="Iniciante">Iniciante</option>
        <option value="Intermediário">Intermediário</option>
        <option value="Avançado">Avançado</option>
      </select>
    </section>

    <section id="ranking" class="ranking"></section>

    <section id="listaJogadores" class="lista-jogadores">
      <p class="subtitulo">Carregando atletas...</p>
    </section>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
