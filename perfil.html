<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Perfil do atleta | Banco de Atletas"><title>Perfil do Atleta | Banco de Atletas</title><link rel="stylesheet" href="estilo.css"><style>.tecnica-section{display:none!important}.perfil-wrap{max-width:980px;margin:auto}.perfil-hero{display:grid;grid-template-columns:300px 1fr;gap:30px;align-items:center;background:rgba(255,250,241,.92);border:1px solid var(--borda);border-radius:30px;padding:30px;box-shadow:var(--sombra)}.perfil-foto{width:100%;aspect-ratio:1;object-fit:cover;border-radius:24px;background:var(--areia);border:5px solid #fff}.perfil-kicker{font-size:11px;font-weight:800;letter-spacing:3px;color:var(--terracota)}.perfil-nome{font:72px/.9 'Bebas Neue',sans-serif;color:var(--verde);margin:10px 0}.perfil-status{display:inline-block;padding:7px 12px;border-radius:999px;background:#e3ecd9;color:var(--verde);font-size:11px;font-weight:800;text-transform:uppercase}.perfil-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-top:25px}.perfil-box{background:#f4ead9;border:1px solid var(--borda);border-radius:18px;padding:18px}.perfil-box span{display:block;font-size:10px;font-weight:800;letter-spacing:2px;color:var(--muted);text-transform:uppercase}.perfil-box strong{display:block;font-size:16px;margin-top:5px;color:var(--verde)}.perfil-section{margin-top:24px;background:rgba(255,250,241,.9);border:1px solid var(--borda);border-radius:24px;padding:25px;box-shadow:var(--sombra)}.perfil-section h2{font:36px 'Bebas Neue',sans-serif;color:var(--verde);margin-bottom:14px}.timeline{border-left:3px solid var(--terracota);padding-left:20px}.timeline-item{position:relative;padding:8px 0 18px}.timeline-item:before{content:'';position:absolute;left:-29px;top:12px;width:12px;height:12px;border-radius:50%;background:var(--terracota);border:3px solid var(--creme)}.timeline-item strong{color:var(--verde)}.perfil-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.perfil-actions a,.perfil-actions button{display:inline-flex;text-decoration:none;align-items:center;justify-content:center}.qr-box{text-align:center}.qr-box img{width:180px;height:180px;border-radius:12px;background:white;padding:8px}.erro-perfil{text-align:center;padding:70px 20px}.erro-perfil h1{font:55px 'Bebas Neue',sans-serif;color:var(--verde)}@media(max-width:700px){.perfil-hero{grid-template-columns:1fr}.perfil-foto{max-width:330px;margin:auto}.perfil-nome{font-size:55px}.perfil-grid{grid-template-columns:1fr}}</style></head><body><header class="header">🏐 PERFIL DO ATLETA</header><main class="container perfil-wrap"><div id="perfilConteudo"><p class="subtitulo">Carregando perfil...</p></div><footer class="site-footer"><strong>🏐 BANCO DE ATLETAS</strong><span>Vôlei de praia • Talento • Evolução</span></footer></main><script type="module" src="perfil.js"></script></body></html>
