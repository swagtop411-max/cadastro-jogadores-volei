name: One-time V11 core hardening retry

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/v11-core-hardening-retry.yml"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Fix literal regex replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-v11-core.py')
          s=p.read_text(encoding='utf-8')
          old='text=read(name); out,n=re.subn(pattern,repl,text,count=count,flags=flags)'
          new='text=read(name); out,n=re.subn(pattern,lambda _m: repl,text,count=count,flags=flags)'
          if old not in s: raise SystemExit('regex helper pattern not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Apply V11 core patch
        run: python scripts/apply-v11-core.py
      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for f in auth-audit-v11.js admin-data-migration-v11.js admin-commerce-v11.js meu-perfil.js admin.js analytics.js conta.js site-v7-autoload.js cadastro-direto.js; do node --check "$f"; done
      - name: Run regression audit
        run: node scripts/audit-v8.mjs
      - name: Compile Firebase rules
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15.1.0 emulators:exec --project demo-cadastro-atletas --only firestore,storage "node -e \"console.log('V11 rules compiled')\""
      - name: Commit V11 core
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: hardening V11 de segurança, planos e dados privados"
          git push
