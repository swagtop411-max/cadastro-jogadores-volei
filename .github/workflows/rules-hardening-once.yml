name: One-time Firestore public privacy hardening

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/rules-hardening-once.yml"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Patch only sensitive public update allowlists
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('firestore.rules')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  """        && request.resource.data.diff(resource.data).affectedKeys().hasOnly([\n          'nome','nascimento','cidade','uf','modalidades','posicoes','modalidade','posicao','categoria',\n          'time','historicoEquipes','historicoCampeonatos','observacoes','foto','ownerUid','ownerEmail','atualizadoEm'\n        ])""",
                  """        && request.resource.data.diff(resource.data).affectedKeys().hasOnly([\n          'nome','cidade','uf','modalidades','posicoes','modalidade','posicao','categoria',\n          'time','historicoEquipes','historicoCampeonatos','observacoes','foto','ownerUid','atualizadoEm'\n        ])"""
              ),
              (
                  "request.resource.data.diff(resource.data).affectedKeys().hasOnly(['nome','responsavel','uf','cidade','modalidade','categoria','logo','atletas'])",
                  "request.resource.data.diff(resource.data).affectedKeys().hasOnly(['nome','uf','cidade','modalidade','categoria','logo','atletas'])"
              )
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Replacement safety check failed: expected 1 occurrence, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          print('Sensitive public update allowlists hardened.')
          PY

      - name: Verify exact hardening
        shell: bash
        run: |
          set -euo pipefail
          grep -q "'nome','cidade','uf','modalidades','posicoes'" firestore.rules
          grep -q "hasOnly(\['nome','uf','cidade','modalidade','categoria','logo','atletas'\])" firestore.rules
          if grep -q "'nome','nascimento','cidade','uf','modalidades'" firestore.rules; then
            echo 'Public athlete rule still permits nascimento.'
            exit 1
          fi
          if grep -q "hasOnly(\['nome','responsavel','uf','cidade','modalidade','categoria','logo','atletas'\])" firestore.rules; then
            echo 'Public team rule still permits responsavel.'
            exit 1
          fi

      - name: Run V8 audit
        run: node scripts/audit-v8.mjs

      - name: Compile Firebase rules
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15.1.0 emulators:exec \
            --project demo-cadastro-atletas \
            --only firestore,storage \
            "node -e \"console.log('Hardened Firebase rules compiled successfully')\""

      - name: Commit hardened rules
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules
          git diff --cached --quiet && exit 0
          git commit -m "security: impedir retorno de dados privados aos documentos publicos"
          git push
