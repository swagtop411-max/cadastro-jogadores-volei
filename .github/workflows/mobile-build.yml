name: Build mobile preview

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Plataforma do build de teste
        required: true
        default: android
        type: choice
        options:
          - android
          - ios

permissions:
  contents: read

concurrency:
  group: mobile-preview-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: true

jobs:
  build-preview:
    if: github.ref_name == 'mobile-foundation'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Verificar configuração EAS
        shell: bash
        run: |
          test -n "$EXPO_TOKEN" || { echo 'Configure o secret EXPO_TOKEN antes de gerar builds.'; exit 1; }
          test -n "$EXPO_PUBLIC_EAS_PROJECT_ID" || { echo 'Configure a variable EXPO_PUBLIC_EAS_PROJECT_ID antes de gerar builds.'; exit 1; }

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Validar aplicativo
        run: |
          npx expo install --check
          npm run typecheck

      - name: Gerar build preview no EAS
        run: npx eas-cli@latest build --platform "${{ inputs.platform }}" --profile preview --non-interactive --no-wait
