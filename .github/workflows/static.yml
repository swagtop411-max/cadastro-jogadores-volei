name: Validate and deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -maxdepth 2 -type f -name '*.js' -print0)

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [Path('firebase.json'), Path('appsscript.json')]:
              if path.exists():
                  with path.open(encoding='utf-8') as f:
                      json.load(f)
                  print('OK', path)
          PY

      - name: Guard against committed admin password
        shell: bash
        run: |
          set -euo pipefail
          needle='147''580'
          if grep -R --exclude-dir=.git --exclude='*.md' -nF "$needle" .; then
            echo 'Admin password must never be committed.'
            exit 1
          fi

      - name: Verify critical security rules
        shell: bash
        run: |
          set -euo pipefail
          grep -q "pagamentoConfirmado', false) == false" firestore.rules
          grep -q "match /equipes/{equipeId}/privado/{documento}" firestore.rules
          grep -q "match /perfis/{uid}/privado/{documento}" firestore.rules
          grep -q "approvedSocialTarget" firestore.rules
          grep -q "match /conversas/{conversationId}" firestore.rules
          grep -q "match /notificacoes/{targetUid}/itens/{notificationId}" firestore.rules
          grep -q "match /story_views/{storyId}/usuarios/{viewerUid}" firestore.rules
          grep -q "match /salvos/{uid}/publicacoes/{postId}" firestore.rules
          grep -q "25 \* 1024 \* 1024" firestore.rules
          grep -q "allow update: if false" storage.rules

      - name: Compile Firebase rules in emulators
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15.1.0 emulators:exec \
            --project demo-cadastro-atletas \
            --only firestore,storage \
            "node -e \"console.log('Firebase rules compiled successfully')\""

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
