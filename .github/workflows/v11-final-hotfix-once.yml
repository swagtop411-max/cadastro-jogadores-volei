name: One-time V11 final hotfix

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/v11-final-hotfix-once.yml"

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Fix mention cache declaration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('social-v6.js')
          s=p.read_text(encoding='utf-8')
          old='let user=auth.currentUser,directoryPromise=null,activeDirectOtherUid="",scheduleTimer=0,directDecorating=false;'
          new='let user=auth.currentUser,activeDirectOtherUid="",scheduleTimer=0,directDecorating=false;'
          if s.count(old)!=1: raise SystemExit(f'directoryPromise esperado 1, encontrado {s.count(old)}')
          s=s.replace(old,new,1)
          old2='const profileCache=new Map(),privacyCache=new Map(),blockCache=new Map(),followCache=new Map(),carouselCache=new Map(),highlightCache=new Map();'
          new2='const profileCache=new Map(),privacyCache=new Map(),blockCache=new Map(),followCache=new Map(),handleCache=new Map(),carouselCache=new Map(),highlightCache=new Map();'
          if s.count(old2)!=1: raise SystemExit(f'cache line esperado 1, encontrado {s.count(old2)}')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Normalize legacy audit tail
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/audit-v8.mjs');s=p.read_text(encoding='utf-8')
          s=s.replace("requireText('social-v6.js','collection(db,\\\"handles\\\")','menções resolvidas por índice de handles');","requireText('social-v6.js','doc(db,\\\"handles\\\",key)','menções resolvidas por índice de handles');")
          marker="requireText('campeonatos-public.js','linkOrganizador: link','link de campeonato estruturado');"
          if marker in s and 'AUDITORIA V11 LEGADA' not in s:
            s=s.replace(marker,marker+"\n\nconsole.log(`\\nAUDITORIA V11 LEGADA: ${notes.length} verificações acumuladas`);\nif(failures.length){console.error(`AUDITORIA V11 LEGADA FALHOU: ${failures.length} problema(s)`);for(const line of failures)console.error(`ERRO ${line}`);process.exit(1)}\nconsole.log('AUDITORIA V11 LEGADA APROVADA ✓');",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate all JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -maxdepth 3 -type f -name '*.js' -print0)
      - name: Run V11 audits
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-v8.mjs
          node scripts/audit-v11.mjs
      - name: Compile Firebase rules
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15.1.0 emulators:exec --project demo-cadastro-atletas --only firestore,storage "node -e \"console.log('V11 final rules compiled')\""
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f firestore-debug.log .github/workflows/v11-final-hotfix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: finalizar auditoria e cache de menções V11"
          git push
