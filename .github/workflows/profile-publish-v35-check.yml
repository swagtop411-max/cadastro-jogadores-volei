name: Profile publish V35

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  audit-v35:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: node --check profile-publish-compat-v35.js
      - name: Validate profile and Story publishing
        run: node scripts/audit-v35-profile-publish.mjs
