name: One-time V11 privacy performance

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/v11-stage2-once.yml"

permissions:
  contents: write

jobs:
  stage2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply V11 stage 2
        run: python scripts/apply-v11-stage2.py
      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for f in *.js; do node --check "$f"; done
          for f in scripts/*.mjs; do node --check "$f"; done
      - name: Run regression audit
        run: node scripts/audit-v8.mjs
      - name: Compile Firebase rules
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15.1.0 emulators:exec --project demo-cadastro-atletas --only firestore,storage "node -e \"console.log('V11 stage2 rules compiled')\""
      - name: Remove one-time migration machinery
        shell: bash
        run: |
          rm -f firestore-debug.log
          rm -f .github/workflows/social-read-caps-once.yml
          rm -f .github/workflows/v11-core-hardening-once.yml
          rm -f .github/workflows/v11-core-hardening-retry.yml
          rm -f .github/workflows/v11-core-hardening-final.yml
          rm -f .github/workflows/v11-stage2-once.yml
          rm -f scripts/apply-v11-core.py
          rm -f scripts/apply-v11-stage2.py
      - name: Commit V11 stage 2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: privacidade, performance e PWA V11"
          git push
