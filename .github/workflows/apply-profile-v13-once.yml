name: Apply profile V13 once

on:
  push:
    paths:
      - '.profile-v13-trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply V13 patch
        run: python scripts/apply-profile-v13.py
      - name: Validate JavaScript syntax
        run: |
          for f in profile-autosync-v13.js admin-profile-browser-v13.js site-v5.js site-v7-autoload.js conta.js meu-perfil.js public.js; do
            node --check "$f"
          done
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules site-v5.js site-v7-autoload.js conta.js meu-perfil.js public.js conta.html atletas.html analytics.js sw.js
          git commit -m "feat: sincronizar contas com perfis sociais V13"
          git push
