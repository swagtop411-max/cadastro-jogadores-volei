name: Android TWA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-twa/**"
      - ".github/workflows/android-twa.yml"

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Build debug APK and unsigned release AAB
        working-directory: android-twa
        run: gradle :app:assembleDebug :app:bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: cadastro-atletas-debug-apk
          path: android-twa/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: cadastro-atletas-unsigned-release-aab
          path: android-twa/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  release-aab:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "ANDROID_KEYSTORE_BASE64 ausente" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "ANDROID_KEYSTORE_PASSWORD ausente" && exit 1)
          test -n "$KEY_ALIAS" || (echo "ANDROID_KEY_ALIAS ausente" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "ANDROID_KEY_PASSWORD ausente" && exit 1)
      - name: Prepare release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android-twa/upload-keystore.jks
          cat > android-twa/keystore.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: Build signed Play AAB
        working-directory: android-twa
        run: gradle :app:bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: cadastro-atletas-play-aab
          path: android-twa/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
