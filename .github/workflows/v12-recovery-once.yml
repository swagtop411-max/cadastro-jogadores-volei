name: V12 one-time recovery

on:
  push:
    branches: [main]
    paths:
      - V12_TRIGGER.txt

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Normalize matchers and apply V12 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('scripts/apply-v12.py')
          s=p.read_text(encoding='utf-8')
          pattern=r"social_read = .*?rules = rules\.replace\(social_read, social_read_admin\)"
          replacement='''social_read = "      allow read: if resource.data.aprovado == true && canReadSocialOwner(resource.data.ownerUid, resource.data.get(\\'visibilidade\\',\\'privado\\'));"\nsocial_read_admin = "      allow read: if isAdmin() || (resource.data.aprovado == true && canReadSocialOwner(resource.data.ownerUid, resource.data.get(\\'visibilidade\\',\\'privado\\')));"\ncount = rules.count(social_read)\nrequire(count >= 3, f'esperava 3 regras sociais sem bypass ADM, encontrei {count}')\nrules = rules.replace(social_read, social_read_admin)'''
          s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n != 1:
              raise SystemExit(f'V12 matcher social falhou: {n}')
          s=s.replace("pattern = r'async function loadCommunity\\(\\)\\{.*?\\n\\}function editValue'", "pattern = r'async function loadCommunity\\(\\)\\{.*?\\}\\nfunction editValue'")
          s=s.replace("pattern = r'async function loadMonetizacao\\(\\)\\{.*?\\n\\}function renderAtletas'", "pattern = r'async function loadMonetizacao\\(\\)\\{.*?\\}\\nfunction renderAtletas'")
          p.write_text(s,encoding='utf-8')
          PY
          python3 scripts/apply-v12.py

      - name: Validate changed JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -maxdepth 3 -type f -name '*.js' -print0)
          node scripts/audit-v11.mjs

      - name: Commit V12 recovery
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No V12 changes needed."
            exit 0
          fi
          git config user.name "swagtop411-max"
          git config user.email "swagtop411@gmail.com"
          git add -A
          git commit -m "fix: recover V11 production regressions"
          git push
