name: V12 one-time recovery

on:
  push:
    branches: [main]
    paths:
      - V12_TRIGGER.txt

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply V12 patch
        run: python3 scripts/apply-v12.py

      - name: Validate changed JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -maxdepth 3 -type f -name '*.js' -print0)
          node scripts/audit-v11.mjs

      - name: Commit V12 recovery
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No V12 changes needed."
            exit 0
          fi
          git config user.name "swagtop411-max"
          git config user.email "swagtop411@gmail.com"
          git add -A
          git commit -m "fix: recover V11 production regressions"
          git push
