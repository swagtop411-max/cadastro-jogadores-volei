name: V57 Play Ready

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-twa/**"
      - "play-store/**"
      - "auth-gate-v53.js"
      - "profile-required-v55.js"
      - "meu-perfil.js"
      - "meu-perfil.html"
      - "conta.js"
      - "conta.html"
      - "tests/profile-required.test.mjs"
      - "terms-consent-v47.js"
      - "age-gate-v47.js"
      - "firebase-app-check-v11.js"
      - "cloudinary-upload.js"
      - "play-store-mode-v44.js"
      - "messaging-v50.js"
      - "admin-moderation-v42.js"
      - "ugc-safety-v41.js"
      - "firestore.rules"
      - "storage.rules"
      - "termos-de-uso.html"
      - "politica-privacidade.html"
      - "exclusao-conta.html"
      - "site-v5.js"
      - "sw.js"
      - "scripts/audit-v47-play-ready.mjs"
      - "tests/playwright/**"
      - "playwright.config.mjs"
      - "package.json"
      - ".github/workflows/v47-play-ready.yml"

permissions:
  contents: read

jobs:
  static-release-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Auditoria estática V55 Play
        run: node scripts/audit-v47-play-ready.mjs
      - name: Testar campos obrigatórios e redirecionamento
        run: node --test tests/profile-required.test.mjs
      - name: Validar JavaScript crítico
        run: |
          node --check auth-gate-v53.js
          node --check profile-required-v55.js
          node --check meu-perfil.js
          node --check conta.js
          node --check terms-consent-v47.js
          node --check age-gate-v47.js
          node --check cloudinary-upload.js
          node --check play-store-mode-v44.js
          node --check messaging-v50.js
          node --check admin-moderation-v42.js
          node --check ugc-safety-v41.js

  android-release-compile:
    needs: static-release-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Instalar Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Compilar APK de teste e AAB release
        working-directory: android-twa
        run: gradle :app:assembleDebug :app:bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: v57-android-unsigned-builds
          path: |
            android-twa/app/build/outputs/apk/debug/app-debug.apk
            android-twa/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  live-browser-smoke:
    if: github.event_name == 'workflow_dispatch'
    needs: [static-release-audit, android-release-compile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependências
        run: npm install
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke web público e autenticado opcional
        env:
          PLAY_BASE_URL: https://cadastrodeatletas.com.br
          PLAY_TEST_EMAIL: ${{ secrets.PLAY_TEST_EMAIL }}
          PLAY_TEST_PASSWORD: ${{ secrets.PLAY_TEST_PASSWORD }}
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v55-playwright-report
          path: playwright-report
          if-no-files-found: ignore

  branding-browser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Conferir logo e abertura em telas pequenas e horizontais
        run: npx playwright test tests/playwright/app-branding.spec.mjs tests/playwright/profile-gate.spec.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: branding-browser-preview
          path: |
            test-results
            playwright-report
