name: Google Play release readiness

on:
  push:
    branches: [main]
    paths:
      - "android-twa/**"
      - "functions/**"
      - "cloudinary-upload.js"
      - "ugc-safety-v41.js"
      - "admin-moderation-v42.js"
      - "conta.html"
      - "conta.js"
      - "play-store-mode-v44.js"
      - "site-v5.js"
      - "exclusao-conta.html"
      - "politica-privacidade.html"
      - "termos-de-uso.html"
      - "play-store/**"
      - "firebase.json"
      - "scripts/audit-play-release.mjs"
      - ".github/workflows/play-release-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit Play release code
        run: node scripts/audit-play-release.mjs

# Final Google Play readiness audit: 2026-09-08
