<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Perfil público de atleta no Banco de Dados de Atletas.">
<title>Perfil do atleta | Banco de Dados de Atletas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site-theme.css?v=20260901-8">
<link rel="stylesheet" href="ranking-global.css?v=20260830-1">
<style>
.public-profile{padding-top:28px!important}
.pp-cover{height:180px;background:linear-gradient(135deg,#dbeafe,#ecfdf5);background-size:cover;background-position:center}
.pp-head{display:grid;grid-template-columns:165px minmax(0,1fr);gap:26px;padding:0 28px 26px;align-items:end}
.pp-avatar{width:160px;height:160px;margin-top:-62px;border-radius:50%;object-fit:cover}
.pp-info{min-width:0;padding-top:18px}.pp-head h1{font-size:38px;line-height:1.05;margin:5px 0 8px}.pp-meta{font-size:11px;margin:0 0 6px}.pp-bio{white-space:pre-wrap;line-height:1.55;max-width:760px;margin:8px 0;color:#475467}.pp-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.pp-stats{display:flex;gap:20px;margin-top:14px;flex-wrap:wrap}.pp-stat{font-size:9px}.pp-stat strong{display:inline;margin-right:4px;font-size:15px}.pp-stat.clickable{cursor:pointer}.pp-section{margin-top:16px;padding:15px}.pp-tabs{display:flex;gap:5px;margin-bottom:13px;overflow-x:auto}.pp-tab{white-space:nowrap}.pp-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.pp-grid-item{position:relative;overflow:hidden;aspect-ratio:1}.pp-grid-item img,.pp-grid-item video{display:block;width:100%;height:100%;object-fit:cover}.pp-grid-item .type{position:absolute;right:7px;top:7px;background:rgba(15,23,42,.7);color:#fff;border-radius:999px;padding:4px 6px;font-size:9px}.pp-stories{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}.pp-story{width:92px;height:122px;object-fit:cover;display:block;border-radius:13px;border:2px solid #60a5fa;flex:0 0 auto}.pp-archive{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.pp-empty{padding:30px;text-align:center;color:#667085;font-size:11px}.pp-modal{position:fixed;inset:0;z-index:60000;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(15,23,42,.35);backdrop-filter:blur(8px)}.pp-modal.open{display:flex}.pp-modal-card{width:min(480px,100%);padding:20px}.pp-user-list{display:grid;gap:8px;max-height:55vh;overflow:auto}.pp-user{display:flex;align-items:center;gap:10px;padding:9px;border-radius:11px;background:#f8fafc;text-decoration:none;color:inherit}.pp-user img{width:42px;height:42px;border-radius:50%;object-fit:cover}.pp-close{float:right;width:36px;height:36px;min-height:36px;padding:0;border:1px solid #e4e7ec;border-radius:10px;background:#fff;color:#475467;font-size:20px}.publish-card{position:relative}.publish-card h2{font-size:23px;margin:6px 0 18px}.publish-options{display:grid;gap:10px}.publish-options .pp-btn{width:100%;padding:13px 14px}.publish-card input{display:none}.composer-label{display:block;color:#2563eb;font-size:8px;font-weight:900;letter-spacing:1.4px;margin:12px 0 6px}.media-preview{width:100%;aspect-ratio:1/1;border-radius:12px;overflow:hidden;display:grid;place-items:center}.media-preview img,.media-preview video{max-width:100%;max-height:100%;object-fit:contain}.composer-actions{display:flex;gap:8px;margin-top:10px}.composer-actions .pp-btn{flex:1}.upload-status{margin-top:9px;text-align:center;color:#667085;font-size:9px}.upload-status.error{color:#b42318}.upload-status.ok{color:#067647}
@media(max-width:720px){.pp-cover{height:120px}.pp-head{grid-template-columns:1fr;padding:0 14px 20px;text-align:center;gap:0}.pp-avatar{width:128px;height:128px;margin:-50px auto 0}.pp-info{padding-top:12px}.pp-head h1{font-size:29px}.pp-actions,.pp-stats{justify-content:center}.pp-section{padding:10px}.pp-grid{gap:3px}.pp-archive{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<header class="header">
<button class="site-menu-trigger" id="siteMenuTrigger" type="button" aria-controls="siteMenuDrawer" aria-expanded="false">☰<span>MENU</span></button>
<a class="header-brand" href="index.html"><div><strong>BANCO DE DADOS DE ATLETAS</strong><span>VÔLEI DE PRAIA</span></div></a>
</header>
<main class="public-profile">
<div class="pp-shell">
<a class="pp-back" href="index.html">← VOLTAR AO FEED</a>
<section class="pp-profile">
<div id="cover" class="pp-cover"></div>
<div class="pp-head">
<img id="avatar" class="pp-avatar" alt="Foto do atleta">
<div class="pp-info">
<span class="pp-kicker">PERFIL DO ATLETA</span>
<h1 id="name">Carregando...</h1>
<p id="meta" class="pp-meta"></p>
<p id="bio" class="pp-bio"></p>
<div id="stats" class="pp-stats">
<span class="pp-stat"><strong id="photos">0</strong>fotos</span>
<span class="pp-stat"><strong id="videos">0</strong>vídeos</span>
<span class="pp-stat"><strong id="stories">0</strong>stories</span>
<span id="followersStat" class="pp-stat clickable"><strong id="followers">0</strong>seguidores</span>
<span id="followingStat" class="pp-stat clickable"><strong id="following">0</strong>seguindo</span>
</div>
<div id="actions" class="pp-actions"></div>
</div>
</div>
</section>
<section class="pp-section">
<div class="pp-tabs">
<button class="pp-tab active" data-tab="posts">▦ PUBLICAÇÕES</button>
<button class="pp-tab" data-tab="stories">◉ STORIES</button>
<button class="pp-tab" data-tab="archive">▣ STORIES POSTADOS</button>
</div>
<div id="gallery" class="pp-grid"></div>
<div id="storyList" class="pp-stories" hidden></div>
<div id="storyArchiveList" class="pp-archive" hidden></div>
</section>
</div>
</main>
<div id="publishModal" class="pp-modal" aria-hidden="true">
<div class="pp-modal-card publish-card">
<button id="closePublish" class="pp-close" type="button">×</button>
<span class="pp-kicker">CRIAR CONTEÚDO</span>
<h2>O que você quer publicar?</h2>
<div class="publish-options">
<button type="button" class="pp-btn primary publish-choice" data-publish-type="feed">▦ POSTAR NO FEED</button>
<button type="button" class="pp-btn publish-choice" data-publish-type="story">◉ POSTAR NOS STORIES</button>
</div>
</div>
</div>
<div id="mediaModal" class="pp-modal" aria-hidden="true">
<div class="pp-modal-card publish-card">
<button id="closeMedia" class="pp-close" type="button">×</button>
<span class="pp-kicker">ADICIONAR MÍDIA</span>
<h2 id="mediaTitle">Escolha como adicionar</h2>
<div id="mediaChooser" class="publish-options">
<button type="button" class="pp-btn primary" id="cameraBtn">📷 ABRIR CÂMERA</button>
<button type="button" class="pp-btn" id="galleryBtn">🖼️ ABRIR GALERIA</button>
</div>
<input id="cameraInput" type="file" accept="image/*,video/*" capture="environment" hidden>
<input id="galleryInput" type="file" accept="image/*,video/*" hidden>
<div id="composer" hidden>
<div class="media-preview"><img id="mediaPreviewImage" alt="Pré-visualização" hidden><video id="mediaPreviewVideo" controls playsinline hidden></video></div>
<label class="composer-label" for="captionInput">LEGENDA</label>
<textarea id="captionInput" maxlength="2200" placeholder="Escreva uma legenda..."></textarea>
<div class="composer-actions"><button type="button" class="pp-btn" id="changeMediaBtn">← TROCAR MÍDIA</button><button type="button" class="pp-btn primary" id="postMediaBtn">PUBLICAR</button></div>
<div id="uploadStatus" class="upload-status" hidden></div>
</div>
</div>
</div>
<div id="listModal" class="pp-modal"><div class="pp-modal-card"><button id="closeModal" class="pp-close">×</button><h2 id="modalTitle">Pessoas</h2><div id="userList" class="pp-user-list"></div></div></div>
<script type="module" src="site-v5.js?v=20260901-8"></script>
<script type="module" src="perfil-social.js?v=20260901-4"></script>
<script type="module" src="ranking.js?v=20260830-5"></script>
<script type="module" src="menu-perfil.js?v=20260830-2"></script>
</body>
</html>
