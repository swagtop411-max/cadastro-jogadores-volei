html,body{height:100%;overflow:hidden}.reels-header{position:fixed!important;left:0;right:0;top:0;z-index:7000!important}.reels-shell{height:100vh;padding-top:66px;background:#020403}.reels-feed{height:calc(100vh - 66px);overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior-y:contain;scrollbar-width:none}.reels-feed::-webkit-scrollbar{display:none}.reel-card{position:relative;height:calc(100vh - 66px);min-height:560px;scroll-snap-align:start;scroll-snap-stop:always;display:grid;place-items:center;background:#000;overflow:hidden}.reel-video{display:block;width:100%;height:100%;object-fit:contain;background:#000}.reel-gradient{position:absolute;inset:45% 0 0;pointer-events:none;background:linear-gradient(transparent,rgba(0,0,0,.82))}.reel-info{position:absolute;z-index:3;left:max(18px,env(safe-area-inset-left));right:90px;bottom:max(22px,env(safe-area-inset-bottom));color:#fff}.reel-author{display:inline-flex;align-items:center;gap:9px;color:#fff;text-decoration:none;font-size:11px;font-weight:900}.reel-author img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid rgba(147,197,253,.9)}.reel-info p{margin:9px 0 0;max-width:620px;font-size:11px;line-height:1.5;text-shadow:0 1px 3px #000}.reel-tools{position:absolute;z-index:4;right:max(15px,env(safe-area-inset-right));bottom:max(28px,env(safe-area-inset-bottom));display:grid;gap:8px}.reel-tool{display:grid!important;place-items:center!important;width:48px!important;height:48px!important;min-height:48px!important;padding:0!important;border:1px solid rgba(255,255,255,.16)!important;border-radius:50%!important;background:rgba(15,23,42,.60)!important;color:#fff!important;font-size:18px!important;backdrop-filter:blur(10px)}.reel-tool.active{color:#93c5fd!important;border-color:#93c5fd!important}.reel-tool span{display:block;font-size:7px;font-weight:900;margin-top:-4px}.reel-play{position:absolute;inset:0;z-index:2;border:0!important;background:transparent!important;cursor:pointer}.reel-center-icon{position:absolute;z-index:5;display:grid;place-items:center;width:76px;height:76px;border-radius:50%;background:rgba(0,0,0,.48);color:#fff;font-size:30px;opacity:0;pointer-events:none;transform:scale(.8);transition:.18s}.reel-center-icon.show{opacity:1;transform:scale(1)}.reels-empty{height:100%;display:grid;place-items:center;text-align:center;color:#98a2b3;padding:25px}.reels-empty strong{display:block;color:#fff!important;font-size:18px;margin-bottom:7px}.reels-empty a{display:inline-flex;margin-top:12px;padding:9px 12px;border:1px solid rgba(147,197,253,.4);border-radius:9px;color:#bfdbfe;text-decoration:none;font-size:8px;font-weight:900}@media(max-width:700px){.reels-header{min-height:60px!important}.reels-shell{padding-top:60px}.reels-feed,.reel-card{height:calc(100vh - 60px)}.reel-info{left:13px;right:72px;bottom:18px}.reel-tools{right:10px;bottom:18px}.reel-tool{width:44px!important;height:44px!important;min-height:44px!important}.reel-info p{font-size:10px}}
</style>
