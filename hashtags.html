.tag-page{max-width:1160px;margin:auto;padding:28px 18px 60px}.tag-top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}.tag-back{color:#2563eb;text-decoration:none;font-size:10px;font-weight:900}.tag-hero{padding:28px;border:1px solid #e4e7ec;border-radius:22px;background:#fff;box-shadow:0 12px 35px rgba(15,23,42,.07)}.tag-kicker{color:#2563eb;font-size:9px;font-weight:900;letter-spacing:2px}.tag-hero h1{margin:7px 0 8px;color:#172033!important;font-size:42px;line-height:1}.tag-hero p{margin:0;color:#667085;font-size:12px;line-height:1.5}.tag-search{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:18px}.tag-search button{min-height:46px;padding:0 20px;border:1px solid #2563eb;border-radius:12px;background:#2563eb;color:#fff;font-weight:900;cursor:pointer}.tag-meta{display:flex;justify-content:space-between;gap:10px;margin:20px 2px 10px;color:#667085;font-size:10px}.tag-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tag-item{position:relative;aspect-ratio:1;overflow:hidden;border:1px solid #e4e7ec;border-radius:12px;background:#f2f4f7;cursor:pointer}.tag-item img,.tag-item video{display:block;width:100%;height:100%;object-fit:cover}.tag-badge{position:absolute;right:7px;top:7px;padding:5px 7px;border-radius:30px;background:rgba(15,23,42,.7);color:#fff;font-size:9px;font-weight:900}.tag-caption{position:absolute;left:0;right:0;bottom:0;padding:30px 9px 8px;background:linear-gradient(transparent,rgba(15,23,42,.82));color:#fff;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag-empty{grid-column:1/-1;padding:45px 20px;text-align:center;border:1px dashed #d0d5dd;border-radius:15px;color:#667085;background:#fff}.tag-modal{position:fixed;inset:0;z-index:60000;display:none;place-items:center;padding:16px;background:rgba(15,23,42,.38);backdrop-filter:blur(8px)}.tag-modal.open{display:grid}.tag-modal-box{width:min(900px,100%);max-height:92vh;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,.7fr);overflow:hidden;border:1px solid #e4e7ec;border-radius:17px;background:#fff;box-shadow:0 28px 90px rgba(15,23,42,.20)}.tag-media{min-height:420px;display:grid;place-items:center;background:#f2f4f7}.tag-media img,.tag-media video{display:block;max-width:100%;max-height:82vh;object-fit:contain}.tag-side{padding:18px;overflow:auto}.tag-author{display:flex;align-items:center;gap:9px;color:#172033;text-decoration:none;font-weight:900;font-size:12px}.tag-author img{width:38px;height:38px;border-radius:50%;object-fit:cover}.tag-side p{white-space:pre-wrap;color:#475467;font-size:12px;line-height:1.55}.tag-close{position:fixed;right:18px;top:15px;z-index:60002;width:42px;height:42px;border:1px solid #d0d5dd;border-radius:50%;background:#fff;color:#475467;font-size:24px;cursor:pointer}@media(max-width:720px){.tag-page{padding:18px 10px 35px}.tag-hero{padding:20px}.tag-hero h1{font-size:34px}.tag-search{grid-template-columns:1fr}.tag-grid{gap:3px}.tag-item{border-radius:5px}.tag-modal-box{grid-template-columns:1fr}.tag-media{min-height:52vh}.tag-side{max-height:35vh}}
