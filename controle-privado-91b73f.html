<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#031424"><title>Console privado</title><style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{min-height:100%;margin:0;background:#031424;color:#f7fbff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body{display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% -10%,#0d3854 0,#031424 42%)}.shell{width:min(440px,100%)}.mark{width:74px;height:74px;margin:0 auto 18px;border-radius:24px;display:grid;place-items:center;background:#08243a;border:1px solid #155574;box-shadow:0 20px 50px rgba(0,0,0,.35);font-size:31px}.card{padding:26px;border-radius:24px;background:#08243a;border:1px solid #154d69;box-shadow:0 24px 70px rgba(0,0,0,.4)}.eyebrow{display:block;color:#18c7f1;font-size:10px;font-weight:900;letter-spacing:1.7px;text-align:center}.title{margin:7px 0 8px;text-align:center;font-size:28px;font-weight:950}.subtitle{margin:0 0 22px;text-align:center;color:#9bb1c2;font-size:13px;line-height:1.6}.field{display:grid;gap:7px;margin-top:12px}.field span{font-size:10px;color:#b5c8d5;font-weight:900;letter-spacing:.8px}.field input{width:100%;min-height:50px;border-radius:13px;border:1px solid #1d5872;background:#031424;color:#fff;padding:0 14px;outline:none;font-size:15px}.field input:focus{border-color:#18c7f1;box-shadow:0 0 0 3px rgba(24,199,241,.12)}button{width:100%;min-height:52px;margin-top:16px;border:0;border-radius:13px;background:#f4c84d;color:#031424;font-weight:950;letter-spacing:.5px;cursor:pointer}.secondary{margin-top:8px;background:transparent;border:1px solid #1a5873;color:#9fdff2}.status{min-height:20px;margin-top:13px;text-align:center;color:#9bb1c2;font-size:12px;line-height:1.5}.status.error{color:#ffb5c2}. mentById('password'),enter=document.getElementById('enter'),reset=document.getElementById('reset'),status=document.getElementById('status');let checking=false;const setStatus=(text,error=false)=>{status.textContent=text;status.className='status'+(error?' error':'')};async function authorized(){await getDocs(query(collection(db,'access_logs'),limit(1)));return true}async function openIfAllowed(user){if(!user||checking)return;checking=true;enter.disabled=true;setStatus('Validando permissão…');try{await authorized();sessionStorage.setItem('owner_console_v31','ok');location.replace('vault-7c3e91a6f4.html')}catch{await signOut(auth).catch(()=>undefined);setStatus('Acesso não autorizado.',true);enter.disabled=false}finally{checking=false}}onAuthStateChanged(auth,user=>{if(user)void openIfAllowed(user)});form.addEventListener('submit',async event=>{event.preventDefault();enter.disabled=true;setStatus('Entrando…');try{const credential=await signInWithEmailAndPassword(auth,email.value.trim(),password.value);await openIfAllowed(credential.user)}catch(error){const code=String(error?.code||'');setStatus(code.includes('invalid-credential')||code.includes('wrong-password')?'E-mail ou senha inválidos.':'Não foi possível entrar agora.',true);enter.disabled=false}});reset.addEventListener('click',async()=>{const value=email.value.trim();if(!value)return setStatus('Digite seu e-mail primeiro.',true);reset.disabled=true;try{await sendPasswordResetEmail(auth,value);setStatus('Link de redefinição enviado.')}catch{setStatus('Não foi possível enviar a redefinição agora.',true)}finally{reset.disabled=false}});</script></body></html>
